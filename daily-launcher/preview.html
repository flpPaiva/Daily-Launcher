<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Visualizar NFe</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/preview.css" />
  </head>
  <body>
    <div id="toolbar">
      <div class="nav-group">
        <button id="btn-prev" aria-label="Página anterior"><span class="material-symbols-outlined">chevron_left</span></button>
        <span id="page-info">— / —</span>
        <button id="btn-next" aria-label="Próxima página"><span class="material-symbols-outlined">chevron_right</span></button>
      </div>
      <div class="nav-group">
        <button id="btn-zoom-out" aria-label="Diminuir zoom"><span class="material-symbols-outlined">remove</span></button>
        <span id="zoom-level">100%</span>
        <button id="btn-zoom-in" aria-label="Aumentar zoom"><span class="material-symbols-outlined">add</span></button>
      </div>
    </div>

    <div id="scroll">
      <span id="loading"><span class="material-symbols-outlined">hourglass_top</span>Carregando PDF…</span>
      <canvas id="canvas" style="display: none"></canvas>
    </div>

    <script type="module" src="src/preview/main.js"></script>
  </body>
</html>
