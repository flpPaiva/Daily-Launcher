<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Daily Launcher</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <!-- ── Tela inicial ──────────────────────────────── -->
    <div id="screen-home" class="screen active">
      <header>
        <img src="icon.png" alt="" class="brand-icon" />
        <div class="brand-text">
          <strong>Daily Launcher</strong>
          <span>Ferramentas NDBS</span>
        </div>
      </header>
      <div class="home-content">
        <button class="home-btn" id="btn-go-launcher">
          <span class="icon-chip"><img src="icon.png" alt="" /></span>
          <span class="home-btn-label">Lançador de Diárias</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-apontamento">
          <span class="icon-chip"><span class="material-symbols-outlined">schedule</span></span>
          <span class="home-btn-label">Apontamento de Atividades</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-senior-x">
          <span class="icon-chip"><span class="material-symbols-outlined">badge</span></span>
          <span class="home-btn-label">Senior-X</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-mantis-home">
          <span class="icon-chip"><span class="material-symbols-outlined">dashboard</span></span>
          <span class="home-btn-label">Mantis</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-axet">
          <span class="icon-chip"><span class="material-symbols-outlined">smart_toy</span></span>
          <span class="home-btn-label">IA - Axet</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-servicenow">
          <span class="icon-chip"><span class="material-symbols-outlined">support_agent</span></span>
          <span class="home-btn-label">Service Now</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-successfactors">
          <span class="icon-chip"><span class="material-symbols-outlined">groups</span></span>
          <span class="home-btn-label">Success Factors</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
        <button class="home-btn" id="btn-knowbe4">
          <span class="icon-chip"><span class="material-symbols-outlined">school</span></span>
          <span class="home-btn-label">KnowBe4</span>
          <span class="material-symbols-outlined home-btn-chevron">chevron_right</span>
        </button>
      </div>
    </div>

    <!-- ── Tela do lançador ──────────────────────────── -->
    <div id="screen-launcher" class="screen">
      <header>
        <button class="btn-back" id="btn-back" aria-label="Voltar">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="header-title">Lançador de Diárias</span>
      </header>

      <div class="content">
        <div class="tools-section">
          <button class="btn btn-secondary btn-sm" id="btn-capture-pdf">
            <span class="material-symbols-outlined">photo_camera</span>Capturar Página em PDF
          </button>

          <button class="btn btn-secondary btn-sm" id="btn-renamer">
            <span class="material-symbols-outlined">sort</span>Renomear arquivos para ordem numérica
          </button>
          <div class="rename-status" id="rename-status"></div>

          <button class="btn btn-secondary btn-sm" id="btn-track-launches">
            <span class="material-symbols-outlined">fact_check</span>Acompanhar Lançamentos
          </button>
        </div>

        <label class="upload-area" id="upload-area" for="file-input">
          <span class="upload-label">
            <span class="material-symbols-outlined upload-icon">upload_file</span>
            Clique para selecionar o PDF
            <span class="upload-hint">ou arraste aqui</span>
          </span>
          <input type="file" id="file-input" accept=".pdf" multiple />
        </label>

        <div class="file-nav" id="file-nav">
          <button class="file-nav-btn" id="btn-prev-file" aria-label="Arquivo anterior">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <span id="file-nav-info">Arquivo 1 de 1</span>
          <button class="file-nav-btn" id="btn-next-file" aria-label="Próximo arquivo">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>

        <div class="status" id="status"></div>

        <div id="form-section">
          <div class="form-group">
            <label class="field-label">Nº NFe</label>
            <input type="text" id="f-code" />
          </div>
          <div class="form-group">
            <label class="field-label">Data</label>
            <input type="text" id="f-date" placeholder="DD/MM/AAAA" />
          </div>
          <div class="form-group">
            <label class="field-label">Valor</label>
            <input type="text" id="f-vlTotal" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label class="field-label">Tipo</label>
            <select id="f-type">
              <option value="Meal">Meal</option>
              <option value="Mercado">Mercado</option>
              <option value="Combustível">Combustível</option>
            </select>
          </div>
          <div class="form-group">
            <label class="field-label">Prioridade</label>
            <select id="f-priority">
              <option value="Mínima">Mínima</option>
              <option value="Baixa">Baixa</option>
              <option value="Média" selected>Média</option>
              <option value="Alta">Alta</option>
              <option value="Urgente">Urgente</option>
            </select>
          </div>

          <hr class="divider" />
          <button class="btn btn-secondary" id="btn-preview">
            <span class="material-symbols-outlined">visibility</span>Visualizar NFe
          </button>
          <button class="btn btn-primary" id="btn-lancar">
            <span class="material-symbols-outlined">edit_document</span>Lançar Diária
          </button>
          <button class="btn btn-success" id="btn-salvar">
            <span class="material-symbols-outlined">save</span>Salvar
          </button>
        </div>
      </div>

      <footer>
        <button class="btn-link" id="btn-mantis">
          <span class="material-symbols-outlined">receipt_long</span>Reembolso de Diárias
        </button>
        <button class="btn-link" id="btn-nota-parana">
          <span class="material-symbols-outlined">storefront</span>Nota Paraná
        </button>
      </footer>
    </div>

    <!-- ── Tela de relatório de lançamentos ────────────── -->
    <div id="screen-report" class="screen">
      <header>
        <button class="btn-back" id="btn-back-report" aria-label="Voltar">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="header-title">Acompanhar Lançamentos</span>
      </header>

      <div class="content">
        <div class="report-empty" id="report-empty">
          <span class="material-symbols-outlined">inbox</span>
          Nenhum lançamento realizado nesta sessão.
        </div>
        <table class="report-table" id="report-table">
          <thead>
            <tr>
              <th>Arquivo</th>
              <th>Nº NFe</th>
              <th>Data</th>
              <th>Valor</th>
              <th>Tipo</th>
              <th>Hora</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="report-tbody"></tbody>
        </table>
        <div class="report-total" id="report-total"></div>

        <hr class="divider" />
        <button class="btn btn-secondary" id="btn-clear-report">
          <span class="material-symbols-outlined">delete_sweep</span>Limpar histórico
        </button>
      </div>
    </div>

    <script type="module" src="src/popup/main.js"></script>
  </body>
</html>
